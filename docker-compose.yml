version: '3.8'

services:
  # PostgreSQL Database
  db:
    image: postgres:16-alpine
    container_name: vtt-transcribe-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-vtt_transcribe}
      POSTGRES_USER: ${POSTGRES_USER:-vtt_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env file}
      POSTGRES_HOST_AUTH_METHOD: ${POSTGRES_HOST_AUTH_METHOD:-scram-sha-256}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/init-db.sql:/docker-entrypoint-initdb.d/init.sql:ro
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-vtt_user} -d ${POSTGRES_DB:-vtt_transcribe}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - vtt-network

  # Local SMTP relay (Postfix). Only reachable from the other containers; it delivers mail itself, or through
  # RELAYHOST if you set one. Without SPF/DKIM for your domain, expect direct delivery to land in spam folders.
  mail:
    image: boky/postfix:latest
    container_name: vtt-transcribe-mail
    restart: unless-stopped
    environment:
      ALLOWED_SENDER_DOMAINS: ${VTT_MAIL_DOMAIN:-localhost}
      HOSTNAME: ${VTT_MAIL_HOSTNAME:-mail.${VTT_MAIL_DOMAIN:-localhost}}
      RELAYHOST: ${RELAYHOST:-}
      RELAYHOST_USERNAME: ${RELAYHOST_USERNAME:-}
      RELAYHOST_PASSWORD: ${RELAYHOST_PASSWORD:-}
    networks:
      - vtt-network

  # FastAPI Backend API
  api:
    build:
      context: .
      dockerfile: Dockerfile
      target: api
      args:
        # "--extra local" adds the key-free engine (faster-whisper + local translation; a larger image)
        SYNC_ARGS: ${SYNC_ARGS:-}
    container_name: vtt-transcribe-api
    restart: unless-stopped
    environment:
      # Database
      DATABASE_URL: postgresql://${POSTGRES_USER:-vtt_user}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-vtt_transcribe}
      
      # OpenAI API
      OPENAI_API_KEY: ${OPENAI_API_KEY:?OPENAI_API_KEY must be set in .env file}
      
      # API Configuration
      API_HOST: ${API_HOST:-0.0.0.0}
      API_PORT: ${API_PORT:-8000}
      API_WORKERS: ${API_WORKERS:-4}
      API_RELOAD: ${API_RELOAD:-false}
      
      # Security
      SECRET_KEY: ${SECRET_KEY:?SECRET_KEY must be set in .env file}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:?ENCRYPTION_KEY must be set in .env file}
      JWT_ALGORITHM: ${JWT_ALGORITHM:-HS512}
      ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES:-30}
      
      # CORS
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000,http://localhost:5173}
      
      # Jobs: uploaded audio lives here (a named volume, so queued jobs survive a restart)
      VTT_DATA_DIR: /app/jobs
      VTT_DEFAULT_RETENTION_DAYS: ${VTT_DEFAULT_RETENTION_DAYS:-7}
      VTT_PUBLIC_URL: ${VTT_PUBLIC_URL:-}
      # Email: by default through the bundled `mail` relay below. Point SMTP_HOST at your own server to use that
      # instead (and set SMTP_HOST= empty to switch email off).
      SMTP_HOST: ${SMTP_HOST-mail}
      SMTP_PORT: ${SMTP_PORT:-25}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-noreply@${VTT_MAIL_DOMAIN:-localhost}}
      SMTP_STARTTLS: ${SMTP_STARTTLS:-false}

      # Storage
      UPLOAD_DIR: ${UPLOAD_DIR:-/app/uploads}
      MAX_UPLOAD_SIZE: ${MAX_UPLOAD_SIZE:-4294967296}
      
      # Logging
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      LOG_FORMAT: ${LOG_FORMAT:-json}
    volumes:
      - upload_data:/app/uploads
      - job_data:/app/jobs
      - ./logs:/app/logs
    ports:
      - "${API_PORT:-8000}:8000"
    depends_on:
      db:
        condition: service_healthy
      mail:
        condition: service_started
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - vtt-network

  # Frontend (Svelte + Vite + TypeScript)
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: vtt-transcribe-frontend
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-3000}:80"
    depends_on:
      - api
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:80"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - vtt-network
    profiles:
      - frontend

volumes:
  postgres_data:
    driver: local
  upload_data:
    driver: local
  job_data:
    driver: local

networks:
  vtt-network:
    driver: bridge
