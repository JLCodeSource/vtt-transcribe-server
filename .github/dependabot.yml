# Low-noise dependency updates: weekly, grouped so one PR covers each ecosystem, and a small cap on open PRs.
# Security fixes arrive immediately regardless of this schedule (Dependabot security updates are enabled in repo settings).
version: 2
updates:
  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 3
    groups:
      python-minor-and-patch:
        update-types: ["minor", "patch"]
    ignore:
      # passlib breaks with bcrypt 5 (pyproject pins bcrypt<5 on purpose); revisit when passlib is replaced
      - dependency-name: "bcrypt"
        update-types: ["version-update:semver-major"]
    commit-message:
      prefix: "deps"

  - package-ecosystem: "npm"
    directory: "/frontend"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 3
    groups:
      frontend-minor-and-patch:
        update-types: ["minor", "patch"]
    ignore:
      # svelte-check and typescript-eslint do not run on TypeScript 7 yet
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
    commit-message:
      prefix: "deps(frontend)"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 2
    groups:
      actions:
        patterns: ["*"]
    commit-message:
      prefix: "ci"

  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 2
    ignore:
      # the image stays on Python 3.12 (onnxruntime and other dependencies have no wheels for newer interpreters yet)
      - dependency-name: "python"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
    commit-message:
      prefix: "deps(docker)"
