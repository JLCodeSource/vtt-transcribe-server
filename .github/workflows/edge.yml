name: Edge images

# Latest-build ("edge") images for the test environment: every push to main publishes
# ghcr.io/jlcodesource/vtt-transcribe-server:edge (lean) and :edge-local (--extra local), with the core
# (vtt-transcribe) built from ITS main branch. Not for production. Never touches PyPI, tags or releases (see release.yml).

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: edge-images
  cancel-in-progress: true

permissions:
  contents: read

env:
  IMAGE: ghcr.io/jlcodesource/vtt-transcribe-server

jobs:
  edge:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - tag: edge
            sync_args: ""
            cache: edge-lean
          - tag: edge-local
            sync_args: "--extra local"
            cache: edge-local
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Resolve core main to a commit
        id: core
        run: |
          sha="$(git ls-remote https://github.com/JLCodeSource/vtt-transcribe refs/heads/main | cut -f1)"
          test -n "$sha"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          target: api-ui
          platforms: linux/amd64
          build-args: |
            SYNC_ARGS=${{ matrix.sync_args }}
            CORE_REF=${{ steps.core.outputs.sha }}
            CORE_SHA=${{ steps.core.outputs.sha }}
            BUILD_SHA=${{ github.sha }}
          push: true
          tags: ${{ env.IMAGE }}:${{ matrix.tag }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.licenses=BSD-3-Clause
            io.vtt.core.revision=${{ steps.core.outputs.sha }}
          cache-from: type=gha,scope=${{ matrix.cache }}
          cache-to: type=gha,mode=max,scope=${{ matrix.cache }}
