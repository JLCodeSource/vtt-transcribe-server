name: Backend CI

# Conservative on purpose: one job, runs only when backend inputs change, cancels superseded runs, has a timeout.
# Run the same commands locally first (see README); CI is the safety net.

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - 'vtt_server/**'
      - 'tests/**'
      - 'pyproject.toml'
      - 'uv.lock'
      - 'ruff.toml'
      - '.github/workflows/ci.yml'
  pull_request:
    branches: [ main ]
    paths:
      - 'vtt_server/**'
      - 'tests/**'
      - 'pyproject.toml'
      - 'uv.lock'
      - 'ruff.toml'
      - '.github/workflows/ci.yml'

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up uv (with dependency cache)
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          python-version: '3.12'

      - name: Install dependencies
        run: uv sync --frozen

      - name: Lint
        run: uv run ruff check .

      - name: Test
        run: uv run pytest -q -p no:cacheprovider
