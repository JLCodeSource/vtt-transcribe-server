name: Docker image

# Builds the lean single-container image (API + bundled UI) and smoke-tests it. Runs only when something that goes into the
# image changes, cancels superseded runs, and never pushes anywhere.

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - 'Dockerfile'
      - '.dockerignore'
      - 'pyproject.toml'
      - 'uv.lock'
      - 'hatch_build.py'
      - 'vtt_server/**'
      - 'frontend/**'
      - '.github/workflows/docker-build-test.yml'
  pull_request:
    branches: [ main ]
    paths:
      - 'Dockerfile'
      - '.dockerignore'
      - 'pyproject.toml'
      - 'uv.lock'
      - 'hatch_build.py'
      - 'vtt_server/**'
      - 'frontend/**'
      - '.github/workflows/docker-build-test.yml'

jobs:
  build-and-smoke-test:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          target: api-ui
          push: false
          load: true
          tags: vtt-server:test
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Runs as a non-root user
        run: |
          uid=$(docker run --rm --entrypoint id vtt-server:test -u)
          echo "uid=$uid"
          test "$uid" != "0"

      - name: Starts and reports healthy, and serves the UI
        run: |
          docker run -d --name vtt -p 8000:8000 \
            -e SECRET_KEY=ci-secret-key-not-used-anywhere-else-0123456789 \
            -e ENCRYPTION_KEY=NIiQ9PoBLY9fpqc_kWzhCE1EvcCpRzSZu9FT339Mz2k= \
            -e DATABASE_URL=sqlite+aiosqlite:////tmp/ci.db \
            vtt-server:test
          for i in $(seq 1 30); do
            if curl -fs http://localhost:8000/health; then echo; break; fi
            echo "waiting... ($i/30)"; sleep 2
          done
          curl -fs http://localhost:8000/health
          curl -fs http://localhost:8000/ | grep -qi "<html"
          # the API is up and protected
          test "$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8000/api/engines)" = "401"

      - name: Container logs on failure
        if: failure()
        run: docker logs vtt || true
