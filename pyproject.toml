[project]
name = "vtt-transcribe-server"
version = "0.1.0"
description = "FastAPI server (users, OAuth, DB, job API) and web app built on the vtt-transcribe transcription package"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "BSD-3-Clause"}
keywords = ["transcription", "whisper", "diarization", "subtitles", "fastapi", "speech-to-text"]
authors = [
    {name = "JLCodeSource", email = "JLCodeSource@gmail.com"}
]
classifiers = [
    "License :: OSI Approved :: BSD License",
    "Development Status :: 4 - Beta",
    "Framework :: FastAPI",
    "Intended Audience :: End Users/Desktop",
    "Topic :: Multimedia :: Sound/Audio :: Speech",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]
dependencies = [
    "vtt-transcribe[sherpa]>=0.6.2",  # core transcription/translation, shared speaker logic, sherpa-onnx diarization (CPU, no torch)
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.34.0",
    "python-multipart>=0.0.20",  # File upload support
    "sqlalchemy[asyncio]>=2.0.0",
    "asyncpg>=0.29.0",  # PostgreSQL async driver
    "aiosqlite>=0.19.0",  # SQLite async driver
    "pyjwt>=2.10.0",  # JWT token handling
    "passlib[bcrypt]>=1.7.4",  # Password hashing
    "bcrypt>=4.0.0,<5.0.0",  # Pin bcrypt <5.0 for passlib compatibility
    "cryptography>=41.0.0",  # API key encryption
    "email-validator>=2.0.0",  # Pydantic email validation
    "authlib>=1.3.0",  # OAuth provider integration
    "httpx>=0.27.0",  # HTTP client for OAuth
    "itsdangerous>=2.1.0",  # Session cookie signing (SessionMiddleware / OAuth CSRF)
]

[project.urls]
Homepage = "https://github.com/JLCodeSource/vtt-transcribe-server"
Repository = "https://github.com/JLCodeSource/vtt-transcribe-server"
Issues = "https://github.com/JLCodeSource/vtt-transcribe-server/issues"
Changelog = "https://github.com/JLCodeSource/vtt-transcribe-server/blob/main/docs/CHANGELOG.md"

[project.optional-dependencies]
# Key-free on-box Whisper (faster-whisper) + local translation (M2M100 via sentencepiece). No torch.
local = ["vtt-transcribe[local]>=0.6.2"]

[project.scripts]
vtt-server = "vtt_server.cli:main"

[dependency-groups]
dev = [
    "hatchling>=1.27.0",  # the packaging test builds a wheel with it
    "coverage>=7.13.2",
    "mypy>=1.19.1",
    "pytest>=9.0.2",
    "pytest-cov>=7.0.0",
    "pytest-asyncio>=0.21.0",
    "ruff>=0.14.14",
    "types-PyYAML>=6.0.0",
    "pyyaml>=6.0",
]

[tool.uv]
override-dependencies = [
    "pillow>=12.1.1",  # Security override for CVE-2026-25990 while moviepy metadata remains constrained
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["vtt_server"]
# the built web UI is git-ignored, so it has to be named explicitly
artifacts = ["vtt_server/static/**"]

[tool.hatch.build.targets.sdist]
include = [
  "/vtt_server",
  "/tests",
  "/README.md",
  "/LICENSE",
  "/hatch_build.py",
  "/docs/CHANGELOG.md",
]
artifacts = ["vtt_server/static/**"]

[tool.hatch.build.hooks.custom]
path = "hatch_build.py"
